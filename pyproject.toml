[project]
name = "kosha"
version = "0.1.0"
description = "How close can a self-hosted 4B model on one GPU get to a frontier API?"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic",
    "datasets>=3.0",
    "diskcache",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "statsmodels",
    "typer",
]

[project.scripts]
kosha = "kosha.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosha"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
